<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatos - Heteroidentificação</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        pre {
            background: #eee;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            max-height: 400px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Dados de Candidatos - PPRN</h1>
        <p>Dados carregados com sucesso do arquivo <code>dados.js</code>:</p>
        
        <pre><code id="conteudo-dados">Carregando dados...</code></pre>
    </div>

    <!-- Importa o arquivo dados.js diretamente do GitHub (link Raw) -->
    <script src="https://raw.githubusercontent.com/arturalves5771-hue/Candidatos_heteroidentifica-ao-pprn/main/dados.js"></script>
    
    <script>
        // Verifica se a variável global window.rawData existe e a exibe na tela
        if (typeof window.rawData !== 'undefined') {
            // Mostra os dados formatados em JSON bonitinho na tela
            document.getElementById("conteudo-dados").textContent = JSON.stringify(window.rawData, null, 2);
        } else {
            document.getElementById("conteudo-dados").textContent = "Erro: A variável 'window.rawData' não foi encontrada.";
        }
    </script>

</body>
</html>
