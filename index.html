<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Dados do GitHub na Vercel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        pre {
            background: #eee;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            max-height: 400px;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Dados do GitHub no Meu Site</h1>
        <p>Abaixo estão os dados carregados diretamente do repositório:</p>
        
        <div id="status" class="loading">Carregando dados...</div>
        <pre><code id="conteudo-dados"></code></pre>
    </div>

    <script>
        // Substitua pelo link BRUTO (Raw) do seu arquivo no GitHub
        const urlGitHub = "https://raw.githubusercontent.com/SEU_USUARIO/SEU_REPOSITORIO/main/SEU_ARQUIVO.csv";

        fetch(urlGitHub)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Não foi possível carregar o arquivo. Verifique o link.");
                }
                return response.text();
            })
            .then(dados => {
                // Exibe o conteúdo bruto do arquivo dentro da tag <pre>
                document.getElementById("conteudo-dados").textContent = dados;
                document.getElementById("status").textContent = "Dados carregados com sucesso!";
                document.getElementById("status").style.color = "green";
            })
            .catch(erro => {
                console.error("Erro:", erro);
                document.getElementById("status").textContent = "Erro ao carregar os dados. Verifique o console.";
                document.getElementById("status").style.color = "red";
            });
    </script>

</body>
</html>
