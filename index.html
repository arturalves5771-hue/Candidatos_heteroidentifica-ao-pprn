<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatos - Heteroidentificação</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        pre {
            background: #eee;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            max-height: 400px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Dados de Candidatos - PPRN</h1>
        <p id="status">Carregando dados do GitHub...</p>
        
        <pre><code id="conteudo-dados">Aguarde...</code></pre>
    </div>

    <script>
        // Link direto Raw do seu arquivo dados.js no GitHub
        const urlGitHub = "https://raw.githubusercontent.com/arturalves5771-hue/Candidatos_heteroidentifica-ao-pprn/main/dados.js";

        fetch(urlGitHub)
            .then(response => {
                if (!response.ok) {
                    throw new Error("Erro ao acessar o arquivo no GitHub.");
                }
                return response.text();
            })
            .then(textoCodigo => {
                // Cria um espaço seguro para executar o código do dados.js e extrair o array window.rawData
                let rawData = [];
                
                // Simula a atribuição do window.rawData para capturar os dados
                const window = {};
                
                // Executa o conteúdo do arquivo baixado
                eval(textoCodigo);

                // Se a variável window.rawData existir agora, exibe ela
                if (window.rawData && Array.isArray(window.rawData)) {
                    document.getElementById("conteudo-dados").textContent = JSON.stringify(window.rawData, null, 2);
                    document.getElementById("status").textContent = `Dados carregados com sucesso! Total de registros: ${window.rawData.length}`;
                    document.getElementById("status").style.color = "green";
                } else {
                    throw new Error("A variável window.rawData não foi encontrada dentro do arquivo.");
                }
            })
            .catch(erro => {
                console.error("Erro:", erro);
                document.getElementById("status").textContent = "Erro ao carregar os dados. Verifique o console.";
                document.getElementById("status").style.color = "red";
                document.getElementById("conteudo-dados").textContent = erro.message;
            });
    </script>

</body>
</html>
