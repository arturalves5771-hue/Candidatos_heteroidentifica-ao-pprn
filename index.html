<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidatos - Heteroidentificação</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        pre {
            background: #eee;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            max-height: 400px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Dados de Candidatos - PPRN</h1>
        <p>Dados carregados do arquivo <code>dados.js</code>:</p>
        
        <pre><code id="conteudo-dados">Carregando dados...</code></pre>
    </div>

    <!-- Importa o seu arquivo dados.js do GitHub (ou local) -->
    <script src="https://raw.githubusercontent.com/arturalves5771-hue/Candidatos_heteroidentifica-ao-pprn/main/dados.js"></script>
    
    <script>
        // Aqui usamos a variável que está dentro do seu dados.js 
        // (Substitua 'dadosCandidatos' pelo nome exato da variável que você criou lá dentro)
        if (typeof dadosCandidatos !== 'undefined') {
            document.getElementById("conteudo-dados").textContent = JSON.stringify(dadosCandidatos, null, 2);
        } else {
            document.getElementById("conteudo-dados").textContent = "Erro: A variável de dados não foi encontrada no arquivo.";
        }
    </script>

</body>
</html>
